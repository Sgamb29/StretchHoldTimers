<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="format-detection" content="telephone=no">
    <title>Stretch Sequence</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Stretching Sequence</h1>
        <a class="nav" href="index.html">Home</a>
        <div class="audioCheck">
            <input type="checkbox" id="audioToggle" name="audioToggle" checked />
            <label for="audioToggle">Audio</label>
            <input type="checkbox" name="screenWake" id="screenWake">
            <label id="wakeLabel" for="screenWake">Keep Screen Awake</label>
        </div>
        <div class="audioCheck">
            <input type="checkbox" id="saveToggle" name="saveToggle" checked />
            <label for="saveToggle">Save sequence</label>
        </div>

        <div class="inputDiv">
            <p>Rest Seconds:</p><input id="restSec" class="input bo-bg" type="number" value="5">
            <p># Sets:</p><input id="numSets" class="input bo-bg" type="number" value="1">
        </div>
            <p><em>Input seconds for each stretch seperated by a dash ex: 20-60-30-20</em></p>
        <div class="inputDiv">
            <p>Stretch Seconds:</p><input id="holdSec" class="input bo-bg" type="text" placeholder="30-30-30">
        </div>

        <button id="startButton" onclick="startSequence()">Start</button>
        <p class="bigOutput" id="indicator"></p>
        <h2 class="bigOutput" id="output"></h2>
        <br><br>
        <button id="pauseButton" onclick="pause()">Pause</button>
        <button onclick="reset()">Reset</button>

    </div>


    <script type="text/javascript" src="script2.js"></script>
</body>
</html>
